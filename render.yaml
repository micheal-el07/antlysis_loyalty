# Render Blueprint — deploy by connecting this repo as a Blueprint in the
# Render dashboard (New > Blueprint). Creates both services, the Postgres
# database and the Redis instance in one go.
#
# After the first sync:
#   1. Render will prompt for the `sync: false` env vars below
#      (ADMIN_EMAIL, ADMIN_PASSWORD, FRONTEND_URL) — fill those in.
#   2. FRONTEND_URL can only be set correctly once you see the actual
#      static site URL Render assigned (usually https://antlity-frontend.onrender.com,
#      but Render appends a suffix if that name is already taken by someone
#      else) — copy it from the antlity-frontend service page.
#   3. If antlity-backend also gets a suffixed URL for the same reason,
#      update the `routes.destination` values below to match and redeploy
#      the static site.
#   4. Plan names/availability change over time — if `plan: free` isn't
#      offered for a service when Render prompts you, pick the cheapest
#      available tier instead.

databases:
  - name: antlity-db
    databaseName: antlity_loyalty
    user: antlity
    plan: free

services:
  - type: redis
    name: antlity-redis
    plan: free
    ipAllowList: [] # only reachable from other services in this account, not the public internet

  - type: web
    name: antlity-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh docker-entrypoint.sh
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: antlity-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: antlity-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: antlity-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Proxies API/upload requests to the backend so the frontend's
      # existing relative fetch() calls (e.g. "/api/v1/auth/login") and
      # <img src="/uploads/...">  reach it, without needing a separate API
      # base URL baked into the frontend build. Order matters: specific
      # rules first, SPA catch-all last.
      - type: rewrite
        source: /api/*
        destination: https://antlity-backend.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://antlity-backend.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
